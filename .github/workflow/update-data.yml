name: Update events

on:
  schedule:
    - cron: "5 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update events
        run: node scripts/update-data.mjs

      - name: Commit changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"

          git add cdn/data.json

          git diff --cached --quiet || git commit -m "Update completed events"

          git push